<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Run classic BASIC computer games in your browser with WebAssembly."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0b" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=5" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%favicon.png?v=5"
    />

    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=5" />

    <link
      rel="mask-icon"
      href="%BASE_URL%safari-pinned-tab.svg?v=5"
      color="#1a5c1a"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png?v=5"
    />
    <script>
      window.coi = { coepCredentialless: () => false };
    </script>
    <!-- Copied as a classic script to register the COI service worker. -->
    <script vite-ignore src="%BASE_URL%coi-serviceworker.js"></script>
    <title>Basicade — Classic BASIC Games</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: #0b0c0b;
      }
      ::selection {
        background: rgba(200, 248, 200, 0.24);
        color: #c8f8c8;
      }
      ::-moz-selection {
        background: rgba(200, 248, 200, 0.24);
        color: #c8f8c8;
      }
      body {
        color: #c8f8c8;
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
      }
      main {
        margin: 0 auto;
        max-width: 800px;
      }
      .launcher {
        align-items: end;
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 16px;
      }
      label {
        color: rgba(255, 255, 255, 0.65);
        display: grid;
        font-size: 12px;
        gap: 6px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      select {
        background: #111512;
        border: 1px solid rgba(200, 248, 200, 0.35);
        border-radius: 6px;
        color: #c8f8c8;
        font: inherit;
        outline: 0;
        padding: 8px 10px;
        font-size: 14px;
        transition:
          border-color 0.18s ease-out,
          box-shadow 0.18s ease-out;
      }
      #status {
        color: #ffc47d;
        font-size: 13px;
        grid-column: 1 / -1;
        margin: 0;
      }
      #terminal-container {
        background: #111512;
        border-radius: 12px;
        box-shadow:
          inset 0 0 30px rgba(255, 255, 255, 0.03),
          0 0 70px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        height: min(600px, calc(100vh - 150px));
        min-height: 360px;
        overflow: hidden;
        position: relative;
      }
      #terminal-container.keyboard-constrained {
        flex: none;
        height: var(--keyboard-terminal-height);
        min-height: 0;
      }
      #terminal-container::before {
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(255, 255, 255, 0.025) 3px
        );
        content: "";
        inset: 0;
        pointer-events: none;
        position: absolute;
        z-index: 2;
      }
      #screen {
        color: #c8f8c8;
        font: inherit;
        height: 100%;
        line-height: 1.2;
        overflow-y: auto;
        padding: 28px;
        scrollbar-width: none;
        text-shadow: 0 0 2px rgba(200, 248, 200, 0.35);
      }
      #screen::-webkit-scrollbar {
        display: none;
      }
      #terminal {
        color: inherit;
        font: inherit;
        margin: 0;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }
      #terminal-input {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%; /* Give it real width so the OS can track the caret */
        height: 1px; /* Keep it 1px tall so it doesn't affect layout */
        font-size: 16px; /* Crucial: prevents iOS from auto-zooming when focused */
        color: transparent;
        background: transparent;
        border: none;
        outline: none;
        caret-color: transparent; /* Hide the native blinking caret */
        pointer-events: none; /* Let clicks pass through to the #screen */
        z-index: -1; /* Tuck it behind the terminal screen */
      }
      .terminal-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }
      .terminal-actions a {
        align-items: center;
        display: inline-flex;
        -webkit-appearance: none;
        appearance: none;
        border: 1px solid rgba(200, 248, 200, 0.25);
        border-radius: 6px;
        color: rgba(200, 248, 200, 0.65);
        justify-content: center;
        outline: 0;
        padding: 0 10px;
        text-decoration: none;
        transition:
          background-color 0.18s ease-out,
          border-color 0.18s ease-out,
          color 0.18s ease-out;
      }
      button {
        --button-transition: 0.18s ease-out;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        border: 1px solid rgba(200, 248, 200, 0.25);
        border-radius: 6px;
        color: rgba(200, 248, 200, 0.65);
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.08em;
        outline: 0;
        padding: 7px 20px;
        text-transform: uppercase;
        transition:
          background-color var(--button-transition),
          border-color var(--button-transition),
          color var(--button-transition),
          text-shadow var(--button-transition);
      }
      @media (hover: hover) {
        select:hover {
          border-color: rgba(200, 248, 200, 0.7);
          box-shadow: 0 0 5px rgba(200, 248, 200, 0.2);
        }
        button:hover,
        button:focus-visible {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          text-shadow: 0 0 5px rgba(200, 248, 200, 0.5);
        }
        .terminal-actions a:hover,
        .terminal-actions a:focus-visible {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
        }
      }
      @media (hover: none) {
        select:active {
          border-color: rgba(200, 248, 200, 0.7);
          box-shadow: 0 0 5px rgba(200, 248, 200, 0.2);
          transition-duration: 0s;
        }
        button:active {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          transition-duration: 0s;
        }
        .terminal-actions a:active {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          transition-duration: 0s;
        }
      }
      #cursor {
        opacity: 1;
      }
      #cursor.blinking {
        animation: cursor-blink 1s steps(1) infinite;
      }
      @keyframes cursor-blink {
        50% {
          opacity: 0;
        }
      }
      @media (max-width: 560px) {
        body {
          padding: 16px 10px;
        }
        main {
          display: flex;
          flex-direction: column;
          min-height: calc(100vh - 32px);
          min-height: calc(100dvh - 32px);
        }
        .launcher {
          flex: none;
          grid-template-columns: 1fr;
        }
        #status {
          grid-column: auto;
        }
        #terminal-container {
          flex: 1 1 auto;
          height: auto;
          min-height: 240px;
        }
        #screen {
          font-size: 14px;
          padding: 18px;
        }
        #terminal-input {
          display: block;
          opacity: 0;
          position: static;
          width: 100%;
          z-index: auto;
        }
      }
      @media (max-height: 500px) and (pointer: coarse) {
        body {
          padding: 10px;
        }
        main {
          display: flex;
          flex-direction: column;
          min-height: calc(100vh - 20px);
          min-height: calc(100dvh - 20px);
        }
        .launcher {
          flex: none;
          grid-template-columns: 1fr 1fr;
        }
        #terminal-container {
          flex: 1 1 auto;
          height: auto;
          min-height: 180px;
        }
        #terminal-input {
          display: block;
          opacity: 0;
          position: static;
          width: 100%;
          z-index: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Basicade — Classic BASIC Games</h1>
      <section class="launcher" aria-label="Game launcher">
        <label>
          Game
          <select id="game-select" aria-label="Select a game"></select>
        </label>
        <label>
          Interpreter
          <select
            id="interpreter-select"
            aria-label="Select an interpreter"
          ></select>
        </label>
        <p id="status" hidden role="status" aria-atomic="true"></p>
      </section>
      <div id="terminal-container">
        <h2 id="terminal-title" class="visually-hidden">Game terminal</h2>
        <p id="terminal-instructions" class="visually-hidden">
          Game output appears in this terminal. When the game asks a question,
          type your answer in the game command input and press Enter.
        </p>
        <div
          id="screen"
          role="region"
          aria-labelledby="terminal-title"
          aria-describedby="terminal-instructions"
          aria-live="off"
        >
          <pre
            id="terminal"
          ><span id="output">LOADING...</span><span id="input"></span><span id="cursor"></span></pre>
          <input
            id="terminal-input"
            type="text"
            enterkeyhint="enter"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            aria-label="Game command input"
            aria-describedby="terminal-instructions"
          />
        </div>
      </div>
      <div class="terminal-actions">
        <a
          id="github-link"
          href="https://github.com/minhqdao/Basicade"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="white">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
            />
          </svg>
        </a>
        <button id="restart-game" type="button">Restart game</button>
      </div>
    </main>
    <script src="./demos/launcher.js" type="module"></script>
  </body>
</html>
