name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 24.18.0
  EMSCRIPTEN_VERSION: 6.0.6

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: "emsdk-cache"

      - name: Install bison and flex (Windows)
        if: runner.os == 'Windows'
        run: choco install winflexbison

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build bwbasic WASM
        run: npm run build:wasm:bwbasic
        shell: bash

      - name: Build retrobasic WASM
        run: npm run build:wasm:retrobasic
        shell: bash
        env:
          BISON: ${{ runner.os == 'Windows' && 'win_bison' || 'bison' }}
          FLEX: ${{ runner.os == 'Windows' && 'win_flex' || 'flex' }}

      - name: Build TypeScript
        run: npm run build

      - name: Build browser launcher
        run: npm run build:demo

      - name: Install browser-test engines
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium webkit

      - name: Test browser interaction
        if: runner.os == 'Linux'
        run: npx playwright test

      - name: Run tests
        run: npm run test
        shell: bash

      - name: Upload verified Pages bundle
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: verified-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-pages:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download verified Pages bundle
        uses: actions/download-artifact@v8
        with:
          name: verified-pages-dist
          path: dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
